services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?}
    restart: unless-stopped
    # En Coolify asigna el dominio al servicio `web` (puerto 80 del contenedor)
    ports:
      - "${WEB_PORT:-3000}:80"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finanzas}
      MYSQL_USER: ${MYSQL_USER:-finanzas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_CLIENT: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-finanzas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finanzas}
      JWT_SECRET: ${JWT_SECRET:?}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
    restart: unless-stopped
    # Puerto del contenedor = 80 (nginx). En Coolify asigna el dominio al servicio `web`.
    # Para acceso directo al host (Tailscale / local) mapea WEB_PORT → 80.
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  mysql_data:
